version: "3.9"

x-app-base: &app_base
  build:
    context: .
  image: rag_app
  env_file: .env
  environment:
    - POSTGRES_CONTENT_HOST=db_content
    - POSTGRES_USER_HOST=db_user
    - REDIS_HOST=redis
  volumes:
    - .:/app
  depends_on:
    - db_content
    - db_user
    - redis
  restart: unless-stopped

services:
  app:
    <<: *app_base
    container_name: rag_app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"

  db_content:
    image: pgvector/pgvector:pg16
    container_name: rag_db_content
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_content:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  db_user:
    image: pgvector/pgvector:pg16
    container_name: rag_db_user
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-rag}
    ports:
      - "5434:5432"
    volumes:
      - pgdata_user:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-rag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *app_base
    container_name: rag_worker
    command: ["celery", "-A", "app.celery_worker.celery", "worker", "--loglevel=info"]
    profiles:
      - worker

volumes:
  pgdata_content:
  pgdata_user:
